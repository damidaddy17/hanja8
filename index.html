<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="8급 한자 탐험">
<link rel="apple-touch-icon" href="apple-touch-icon.PNG">
<link rel="icon" type="image/png" href="apple-touch-icon.PNG">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>아빠와 8급 한자 탐험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: 깍두기 공책 한 장 위에 카드가 놓인 느낌. 가로 아이패드는 2단(설명 | 쓰기판), 좁으면 1단.
   한 가지 화면(밝은 공책)으로 의도적으로 고정한 디자인 — 모든 색을 명시함. */
:root{
  --paper:#EAF2FB;      /* 연한 하늘색 공책 바탕 */
  --accent:#2B6CC4;     /* 수현이가 좋아하는 파랑 */
  --accent-deep:#1A4C96;
  --sheet:#FFFFFF;
  --ink:#1B2A3D;        /* 먹색 */
  --ink-soft:#56677C;
  --line:#D2DEEC;
  --grid:#8FB3DE;       /* 공책 파란 칸 */
  --ghost:#DCE5F0;
  --stamp:#D23A2E;      /* 인주: 도장·틀림 표시에만 */
  --sun:#F2B632;        /* 칭찬 스티커 */
  --sky:#1F5FBF;        /* 펜슬 잉크 */
  --leaf:#2E8B57;
  --f-display:"Jua","Apple SD Gothic Neo",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --f-han:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;   /* 해서체: 교과서 손글씨처럼 획이 그대로 보임 */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
.han{font-family:var(--f-han);font-weight:700}
/* 서체 최고 굵기(700)보다 조금 더 굵게: 같은 색 테두리를 덧그림 */
.han,.word .h,.ctab,.choice.han,.qbody .sent u{-webkit-text-stroke:.028em currentColor;paint-order:stroke fill}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .seal{width:44px;height:44px;border-radius:10px;background:var(--stamp);color:#fff;display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:26px;transform:rotate(-4deg);background:var(--accent)}
.brand h1{font-size:24px}
.brand h1 span{font-family:var(--f-body);font-size:15px;color:var(--ink-soft);white-space:nowrap}
.nav{display:flex;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{padding:8px 16px;border-radius:999px;font-family:var(--f-display);font-size:17px;color:var(--ink-soft)}
.nav button[aria-current="true"]{background:var(--accent-deep);color:#fff}
.mockchip{font-size:13px;background:var(--sun);color:var(--ink);padding:4px 10px;border-radius:6px;font-weight:700}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:18px}
.sec{display:grid;gap:14px;margin-top:26px}
.sec>h2{font-size:22px;display:flex;align-items:baseline;gap:10px}
.sec>h2 small{font-family:var(--f-body);font-size:14px;color:var(--ink-soft)}

/* home: today */
.today{display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.today .main{padding:30px 32px 32px;display:grid;gap:18px;align-content:start}
.dayhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.today .eyebrow{font-family:var(--f-display);font-size:20px;color:var(--accent);margin-right:auto}
.today .eyebrow span{color:var(--ink-soft);font-size:16px}
.planbtn{font-family:var(--f-display);font-size:17px;padding:10px 16px;border-radius:12px;background:var(--paper);border:1.5px solid var(--grid);color:var(--accent-deep)}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.steps i{height:8px;border-radius:99px;background:var(--line)}
.steps i.done{background:var(--leaf)}
.steps i.cur{background:var(--accent)}
.today h2{font-size:40px}
.today .chars{display:grid;grid-template-columns:repeat(5,minmax(0,72px));gap:10px}
.today .chars span{aspect-ratio:1;display:grid;place-items:center;font-size:44px;border:2px solid var(--grid);border-radius:6px;background:var(--sheet)}
.today .meta{color:var(--ink-soft);font-size:17px;line-height:1.7}
.today .btn{min-height:60px;font-size:22px;padding:0 30px}
.tabhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.tabhead h2{font-size:30px}
.tabhead .scope{font-family:var(--f-display);font-size:17px;color:var(--accent);margin-right:auto}
.scopenote{margin:0;color:var(--ink-soft);font-size:16px}
.emptynote{padding:28px;display:grid;gap:12px;justify-items:start}
.emptynote h3{font-size:24px}
.emptynote p{margin:0;color:var(--ink-soft)}
.lesson.done,.play.done{background:#F2F9F4;border-color:#BFE0CB}
.play{position:relative}
.cstamp{position:absolute;top:12px;right:12px;width:52px;height:52px;border-radius:50%;border:2.5px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-display);font-size:15px;transform:rotate(-12deg);background:rgba(255,255,255,.75)}
.best{font-size:13px;color:var(--leaf);font-weight:700}
.donebanner{margin-top:14px;padding:18px 22px;display:flex;gap:20px;align-items:center;background:#F2F9F4;border-color:#BFE0CB}
.donebanner h3{font-size:26px;color:var(--leaf)}
.donebanner p{margin:4px 0 0;color:var(--ink-soft)}
.bigstamp{width:88px;height:88px;flex:none;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:17px;line-height:1.15;transform:rotate(-12deg);background:var(--sheet)}
.choice.picked{border-color:var(--accent);background:#E3EEFB}
.btn:disabled{opacity:.35;cursor:default}
.etime{margin-left:auto;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;color:var(--accent)}
.enav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.confirmbar{margin-top:10px;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirmbar span{margin-right:auto}
.passmsg{margin:0;color:var(--leaf);font-family:var(--f-display);font-size:24px}
.failmsg{margin:0;color:var(--accent);font-family:var(--f-display);font-size:20px}
.wtitle{font-size:20px}
.wrongs{display:grid;gap:8px}
.wrong{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.wn{grid-row:span 2;font-family:var(--f-display);color:var(--stamp)}
.wq{font-size:17px}
.wq u{text-decoration:none;border-bottom:2px solid var(--accent);font-family:var(--f-han);font-weight:700;font-size:20px}
.wq .han{font-size:22px}
.wa{font-size:14px;color:var(--ink-soft)}
.hwlog{width:100%;display:grid;gap:8px}
.hwlog h3{font-size:16px;color:var(--ink-soft)}
.hwrow{display:flex;gap:10px;flex-wrap:wrap}
.hwrow figure{margin:0;display:grid;gap:4px;justify-items:center;text-align:center}
.hwrow svg{width:96px;height:96px;border:1.5px solid var(--grid);border-radius:4px;background:var(--sheet)}
.hwrow figure.solo svg{border-color:var(--accent);border-width:2.5px}
.hwrow figcaption{font-size:12px;color:var(--ink-soft);line-height:1.4}
.hwrow figcaption b{color:var(--ink)}
.hwempty{margin:0;font-size:14px;color:var(--ink-soft)}
.dadwrap{text-align:center;margin-top:28px}
.dadbtn{font-size:14px;color:var(--ink-soft);padding:8px 16px;border:1px dashed var(--grid);border-radius:10px}
.dadbox{width:min(100%,520px)}
.pindots{display:flex;gap:16px;justify-content:center;margin:4px 0}
.pindots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
.pindots i.on{background:var(--accent)}
.pindots.shake{animation:shake .35s}
.pinmsg{min-height:22px;text-align:center;color:var(--stamp);margin:0;font-size:14px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,300px);margin:0 auto}
.pinpad button{height:64px;border-radius:16px;background:var(--paper);font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.pinpad button:active{background:var(--line)}
.dadsec{display:grid;gap:8px;padding-top:14px;margin-top:6px;border-top:1px solid var(--line)}
.dadsec h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.dadsec p{margin:0;font-size:14px;color:var(--ink-soft)}
.dadrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.dadrow b{font-family:var(--f-display);font-weight:400;color:var(--accent);width:56px;flex:none}
.dadrow span{flex:1;min-width:0;font-size:14px;color:var(--ink-soft)}
.dadrow button{font-size:14px;padding:7px 12px;border-radius:8px;border:1.5px solid var(--stamp);color:var(--stamp);flex:none}
.btn.warnbtn{background:var(--stamp);color:#fff;justify-self:start;min-height:46px;font-size:17px}
.dadnote{margin:0;padding:10px 12px;border-radius:10px;background:#E5F4EB;color:var(--leaf);font-weight:700}
/* 학습 계획 모달 */
.modal{position:fixed;inset:0;z-index:40;background:rgba(31,43,55,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s both}
.mbox{background:var(--sheet);border-radius:20px;width:min(100%,480px);max-height:100%;overflow:auto;padding:22px;display:grid;gap:8px;box-shadow:0 20px 50px rgba(31,43,55,.25);animation:pop .25s cubic-bezier(.2,1.3,.5,1) both}
.mhead{display:flex;align-items:center}
.mhead h3{font-size:24px;margin-right:auto}
.mclose{width:44px;height:44px;border-radius:50%;background:var(--paper);font-size:18px}
.msub{margin:0 0 6px;color:var(--ink-soft);font-size:15px}
.mlist{display:grid;gap:6px}
.mbox{width:min(100%,600px)}
.mlist{gap:10px}
.pcard{display:grid;gap:6px;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;width:100%;background:var(--sheet)}
.pcard.now{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--accent)}
.ph strong{font-family:var(--f-display);font-weight:400;font-size:18px;margin-right:auto}
.pstate{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--paper);color:var(--ink-soft);font-weight:700}
.pstate.done{background:#E5F4EB;color:var(--leaf)}
.pcard{position:relative}
.pcard.done{background:#F2F9F4;border-color:#BFE0CB}
.pcard.done .ph b{color:var(--leaf)}
.pstamp{position:absolute;right:14px;top:50%;width:64px;height:64px;margin-top:-32px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--f-display);font-size:18px;transform:rotate(-12deg);background:rgba(255,255,255,.7)}
.pcard.done .ph,.pcard.done .pl,.pcard.done .pmeta{padding-right:76px}
.pbar{height:6px;border-radius:99px;background:var(--paper);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.msum{font-family:var(--f-display);font-size:17px;color:var(--ink-soft)}
.msum b{font-weight:400;color:var(--leaf);font-size:22px}
.pstate.cur{background:var(--accent);color:#fff}
.pl{display:flex;gap:10px;align-items:center;font-size:15px;flex-wrap:wrap}
.pl .pn{font-size:12px;color:var(--ink-soft);padding:2px 8px;border-radius:6px;background:var(--paper)}
.pl .hz{font-size:20px;letter-spacing:3px}
.pl .hz i{font-style:normal}
.pl .hz i.ok{color:var(--stamp)}
.pmeta{font-size:13px;color:var(--ink-soft);line-height:1.5}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:14px;font-family:var(--f-display);font-size:20px;background:var(--accent-deep);color:#fff}
.btn.alt{background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink)}
.btn.red{background:var(--accent)}
.week{background:var(--paper);border-left:1px solid var(--line);padding:20px;display:grid;gap:6px;align-content:start}
.week h3{font-size:17px;margin-bottom:4px}
.week h3 small{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);margin-left:6px}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;font-size:15px;text-align:left;width:100%}
.day:hover{background:var(--sheet)}
.day em{font-style:normal;font-size:12px;color:var(--leaf);font-weight:700}
.today .chars span.ok{color:var(--stamp);border-color:var(--stamp);box-shadow:0 0 0 1.5px var(--stamp) inset}
.day b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--ink-soft)}
.day.now{background:var(--sheet);box-shadow:0 0 0 2px var(--accent) inset}
.day.now b{color:var(--accent)}
.day.test b{color:var(--accent)}

/* progress */
.progress{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px}
.bar{flex:1 1 200px;height:14px;background:var(--paper);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.progress{display:grid;gap:14px}
.phead{display:flex;align-items:center}
.slots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.slots span{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:clamp(16px,3vw,26px);color:#B4C3D4}
.slots span.ok{border:2.5px solid var(--stamp);color:var(--stamp);transform:rotate(-6deg)}
.cheerline{font-family:var(--f-display);font-size:18px;color:var(--accent)}
.overall{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px}
.overall .bar{height:8px}
.progress .num{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.examinfo{display:flex;gap:8px;flex-wrap:wrap}
.examinfo span{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--paper);color:var(--ink-soft)}

/* lessons */
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lesson{padding:18px 20px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;position:relative;min-width:0}
.lesson .n{font-size:13px;color:var(--ink-soft)}
.lesson h3{font-size:18px}
.lesson .row{display:grid;grid-template-columns:repeat(5,minmax(0,44px));gap:8px;min-width:0}
.lesson .row span{aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:24px;line-height:1;border-radius:50%;position:relative}
.lesson .row span.ok{color:var(--stamp);box-shadow:0 0 0 2px var(--stamp) inset}
.lesson.locked{opacity:.5}
.lesson.locked::after{content:"잠김";position:absolute;top:12px;right:12px;font-size:12px;color:var(--ink-soft)}

/* play */
.plays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.play.exam{grid-column:1/-1}
.play{padding:18px 20px;text-align:left;display:grid;gap:6px}
.play .ex{font-size:26px;height:40px;display:flex;align-items:center;gap:6px}
.play .ex small{font-family:var(--f-body);font-size:15px;color:var(--ink-soft);font-weight:400}
.play h3{font-size:18px}
.play p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.45}
.play .tag{font-size:12px;color:var(--accent)}
.play.exam{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
.play.exam p{color:#C9D4DA}

/* lesson view */
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tabs .back{font-family:var(--f-display);font-size:17px;padding:8px 12px;border-radius:10px;background:var(--sheet);border:1px solid var(--line)}
.tabs .ttl{font-family:var(--f-display);font-size:20px;margin-right:auto;margin-left:6px}
.ctab{width:56px;height:56px;border-radius:12px;background:var(--sheet);border:1.5px solid var(--line);font-family:var(--f-han);font-weight:700;font-size:30px;position:relative}
.ctab[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.ctab .dot{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--stamp);color:#fff;font-size:11px;font-family:var(--f-body);display:grid;place-items:center;font-weight:700}
.study{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:14px}
.info{padding:22px;display:grid;gap:16px;align-content:start}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigbox{width:150px;height:150px;flex:none;border:2px solid var(--grid);border-radius:6px;position:relative;display:grid;place-items:center;font-size:118px;line-height:1;background:
  linear-gradient(var(--grid),var(--grid)) center/100% 1px no-repeat,
  linear-gradient(var(--grid),var(--grid)) center/1px 100% no-repeat}
.bigbox::before{content:"";position:absolute;inset:0;background:var(--sheet);opacity:.55}
.bigbox span{position:relative;padding-bottom:10px}
.hunum{display:grid;gap:6px}
.hunum .hm{font-family:var(--f-display);font-size:40px;line-height:1.1}
.hunum .hm em{font-style:normal;color:var(--stamp)}
.hunum .sub{font-size:14px;color:var(--ink-soft)}
.speak{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--paper);font-size:15px;font-family:var(--f-display);width:max-content}
.speak svg{width:20px;height:20px}
.story{background:var(--paper);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.story h3{font-size:16px;color:var(--ink-soft)}
.story p{margin:0;font-size:18px;line-height:1.65}
.words{display:grid;gap:8px}
.words h3{font-size:16px;color:var(--ink-soft)}
.word{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;text-align:left}
.word .h{font-family:var(--f-han);font-weight:700;font-size:26px}
.word .r{font-family:var(--f-display);font-size:20px}
.word .m{font-size:14px;color:var(--ink-soft)}
.word svg{width:20px;height:20px;color:var(--ink-soft)}

.write{padding:18px;display:grid;gap:14px;justify-items:center;align-content:start}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,560px);background:var(--paper);padding:5px;border-radius:14px}
.modes button{padding:10px 4px;border-radius:10px;font-family:var(--f-display);font-size:17px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:6px}
.modes button i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--sheet);display:grid;place-items:center;font-size:13px}
.modes button.done i{background:var(--leaf);color:#fff}
.modes button[aria-current="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(31,43,55,.15)}
.board{position:relative;width:min(100%,480px);aspect-ratio:1;max-width:100%;border:2.5px solid var(--grid);border-radius:6px;touch-action:none;background:var(--sheet)}
.board .g{position:absolute;inset:0;width:100%;height:100%}
.board .w{position:absolute;inset:0}
.status{min-height:30px;font-family:var(--f-display);font-size:20px;text-align:center}
.status.good{color:var(--leaf)}
.status.oops{color:var(--stamp)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.actions .btn{min-height:46px;font-size:17px;padding:0 18px}
.order{width:100%;display:grid;gap:8px}
.order h3{font-size:16px;color:var(--ink-soft)}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.strip figure{margin:0;display:grid;justify-items:center;gap:2px}
.strip svg{width:54px;height:54px;border:1px solid var(--grid);border-radius:3px;background:var(--sheet)}
.strip figcaption{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.notebook{padding:18px;display:grid;gap:12px;margin-top:16px}
.nb-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nb-head h3{font-size:20px;margin-right:auto}
.nb-head .hint{font-size:14px;color:var(--ink-soft);width:100%}
.nbdone{font-family:var(--f-body);font-size:13px;font-weight:700;color:#fff;background:var(--leaf);padding:3px 10px;border-radius:99px;vertical-align:middle}
.ctab .ndot{position:absolute;left:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}
.nb-msg{min-height:26px;font-family:var(--f-display);font-size:18px;color:var(--accent);text-align:center}
.nb-msg.warn{color:var(--stamp)}
.chip{padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);font-family:var(--f-display);font-size:16px;background:var(--sheet)}
.chip.on{border-color:var(--sky);color:var(--sky)}
.note{position:relative;width:100%;touch-action:none}
.note canvas{position:absolute;inset:0;width:100%;height:100%}

/* stamp */
.stampfx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.stampfx div{width:220px;height:220px;border-radius:50%;border:8px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:38px;line-height:1.1;transform:rotate(-14deg);background:rgba(255,255,255,.85);animation:stamp .5s cubic-bezier(.2,1.6,.5,1) both}
.stampfx div small{display:block;font-size:20px}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.4);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}

/* quiz */
.quiz{margin-top:14px;padding:24px;display:grid;gap:18px}
.qtop{display:flex;align-items:center;gap:12px}
.qtop .kind{font-family:var(--f-display);font-size:16px;padding:4px 12px;border-radius:99px;background:var(--paper)}
.qtop .count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.o{background:var(--leaf)}
.dots i.x{background:var(--stamp)}
.dots i.c{background:var(--ink)}
.qask{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-display);font-size:22px}
.qbody{display:grid;place-items:center;min-height:180px;text-align:center}
.qbody .bigq{font-size:130px;line-height:1}
.qbody .hq{font-family:var(--f-display);font-size:52px}
.qbody .sent{font-size:26px;line-height:1.8}
.qbody .sent u{font-family:var(--f-han);font-weight:700;font-size:36px;text-decoration:none;border-bottom:3px solid var(--accent);padding:0 4px}
.qbody svg{width:190px;height:190px;border:2px solid var(--grid);border-radius:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:72px;border-radius:14px;border:2px solid var(--line);background:var(--sheet);font-family:var(--f-display);font-size:26px;display:flex;align-items:center;justify-content:center;gap:10px}
.choice .no{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-soft);font-size:15px;display:grid;place-items:center;color:var(--ink-soft);font-family:var(--f-body)}
.choice.han{font-family:var(--f-han);font-weight:700;font-size:40px}
.choice.right{border-color:var(--leaf);background:#E5F4EB}
.choice.wrong{border-color:var(--stamp);background:#FBE7E4;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:28px;text-align:center;font-size:18px}
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding:20px 0}
.result .score{font-family:var(--f-display);font-size:64px;line-height:1}

.voiceset{padding:18px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;align-items:center}
.voiceset label,.voiceset .lbl{font-family:var(--f-display);font-size:17px}
.voiceset select{height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);font:inherit;font-size:16px;padding:0 10px;min-width:0;max-width:100%}
.speeds{display:flex;gap:8px;flex-wrap:wrap}
.voiceset .btn{grid-column:1/-1;justify-self:start;min-height:46px;font-size:17px}
.voiceset .btn svg{width:20px;height:20px}
.vtip{grid-column:1/-1;margin:0;font-size:14px;color:var(--ink-soft);line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:15px;z-index:60}

@media (max-width:720px){
  .lessons{grid-template-columns:minmax(0,1fr)}
  .today{grid-template-columns:minmax(0,1fr)}
  .week{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:480px){
  .today .main{padding:22px 18px}
  .today h2{font-size:30px}
  .today .chars span{font-size:32px}
  .bigbox{width:110px;height:110px;font-size:86px}
  .hunum .hm{font-size:32px}
  .choices{grid-template-columns:1fr}
  .qbody .bigq{font-size:100px}
  .modes button{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hasJong(n){const c=n.charCodeAt(n.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;}
const CHILD='수현';   // 성을 빼고 다정하게: 수현아, 수현이가
const NA=()=>esc(CHILD+(hasJong(CHILD)?'아':'야'));

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
/* 읽어주기: 기기에 설치된 한국어 목소리 중 가장 좋은 것을 고르고, 문장 단위로 끊어 읽음 */
let VOICES=[];
function loadVoices(){
  try{VOICES=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));}catch(e){}
}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){speechSynthesis.onvoiceschanged=loadVoices;}}
const rankVoice=v=>(/google/i.test(v.name)?10:0)+(/premium|프리미엄/i.test(v.name)?4:0)+(/enhanced|향상/i.test(v.name)?3:0)+(/yuna|유나/i.test(v.name)?1:0);
function pickVoice(){
  // 'Google 한국의'가 1순위, 없으면(아이패드) 설치된 목소리 중 프리미엄 > 향상된 품질 순
  return VOICES.slice().sort((a,b)=>rankVoice(b)-rankVoice(a))[0];
}
function cleanSpeech(t){
  return String(t)
    .replace(/\([^)]*[一-鿿][^)]*\)/g,'')   // 팔(八)자 → 팔자
    .replace(/[一-鿿]+/g,'')
    .replace(/&#39;|[‘’'"“”]/g,'')
    .replace(/[·→]/g,', ')
    .replace(/\s+/g,' ').trim();
}
function speak(t){
  try{
    if(!('speechSynthesis' in window)) throw 0;
    speechSynthesis.cancel();
    const v=pickVoice();
    (cleanSpeech(t).match(/[^.!?]+[.!?]*/g)||[]).map(s=>s.trim()).filter(Boolean).forEach(s=>{
      const u=new SpeechSynthesisUtterance(s); u.lang='ko-KR'; if(v) u.voice=v;
      u.rate=0.95; u.pitch=1.05; speechSynthesis.speak(u);
    });
  }catch(e){toast('이 기기에서는 읽어주기를 쓸 수 없어요');}
}
let actx;
function chime(ok=true){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[660,880]:[300,220];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      const t=actx.currentTime+i*0.12;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.3);});
  }catch(e){}
}
function stampFx(big='참 잘했어요',small=''){
  const d=document.createElement('div');d.className='stampfx';
  d.innerHTML=`<div><span>${big}${small?`<small>${small}</small>`:''}</span></div>`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),1500);
}
function charSVG(c,{upto=99,hl=-1,ghost=true}={}){
  const d=STROKES[c]; if(!d) return '';
  const p=d.strokes.map((s,i)=>{
    const fill=i===hl?'#D23A2E':(i<upto?'#1B2A3D':(ghost?'#DCE5F0':'none'));
    return `<path d="${s}" fill="${fill}"/>`;}).join('');
  const grid='<path d="M512 0V1024M0 512H1024" stroke="#8FB3DE" stroke-width="6" stroke-dasharray="24 18" fill="none"/>';
  return `<svg viewBox="0 0 1024 1024" aria-hidden="true">${grid}<g transform="translate(0,900) scale(1,-1)">${p}</g></svg>`;
}

  $('#prev').onclick=()=>go('lesson',flat[idx-1]);
  $('#next').textContent=idx===flat.length-1?'오늘의 퀴즈 →':'다음 글자 →';
  $('#next').onclick=()=>idx===flat.length-1?go('quiz'):go('lesson',flat[idx+1]);

  /* writer */
  const wEl=$('#w'), status=$('#status'), actions=$('#actions');
  /* 따라 쓰기·혼자 쓰기 글씨 기록: 글자마다 따로 저장, 종류별 최근 3개 */
  const HW_KEY='hanja8-hw-'+c;
  let hw={trace:[],solo:[]}; try{hw=Object.assign(hw,JSON.parse(localStorage.getItem(HW_KEY)||'{}'));}catch(e){}
  const hwSVG=a=>`<svg viewBox="0 0 1024 1024" aria-hidden="true"><path d="M512 0V1024M0 512H1024" stroke="#8FB3DE" stroke-width="6" stroke-dasharray="24 18" fill="none"/>
    <g transform="translate(0,900) scale(1,-1)" fill="none" stroke="#1F5FBF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    ${a.s.map(ps=>`<polyline points="${ps.map(q=>q.join(',')).join(' ')}"/>`).join('')}</g></svg>`;
  function drawHW(){
    const all=[...hw.solo.map(a=>({...a,k:'혼자 쓰기'})),...hw.trace.map(a=>({...a,k:'따라 쓰기'}))].sort((x,y)=>y.t-x.t);
    $('#hwlog').innerHTML=`<h3>${NI()} 글씨 기록</h3>`+(all.length
      ?`<div class="hwrow">${all.map(a=>{const d=new Date(a.t);return `<figure class="${a.k==='혼자 쓰기'?'solo':''}">${hwSVG(a)}
        <figcaption><b>${a.k}</b><br>${d.getMonth()+1}/${d.getDate()} · ${a.m?`틀린 획 ${a.m}`:'한 번에 성공'}</figcaption></figure>`;}).join('')}</div>`
      :`<p class="hwempty">따라 쓰기나 혼자 쓰기를 마치면 여기에 ${NI()} 글씨가 남아.</p>`);
  }
  function keepHW(kind,strokes,mistakes){
    hw[kind]=[{t:Date.now(),m:mistakes,s:strokes},...hw[kind]].slice(0,3);
    try{localStorage.setItem(HW_KEY,JSON.stringify(hw));}catch(e){}
    drawHW();
  }
  drawHW();
  let writer=null, mode=null;
  const setStatus=(t,cls='')=>{status.textContent=t;status.className='status '+cls;};
  const markModes=()=>view.querySelectorAll('.modes button').forEach(b=>{
    b.setAttribute('aria-current',String(b.dataset.m===mode));
    b.classList.toggle('done',!!(b.dataset.m==='solo'?S.soloDone:S[b.dataset.m])[c]);});
  function make(opts){
    wEl.innerHTML='';
    const size=wEl.clientWidth;
    writer=HanziWriter.create(wEl,c,Object.assign({
      width:size,height:size,padding:size*0.07,
      charDataLoader:(ch,done)=>done(STROKES[ch]),
      strokeColor:'#1B2A3D',outlineColor:'#DCE5F0',drawingColor:'#1F5FBF',highlightColor:'#F2B632',
      drawingWidth:Math.max(16,size/20),showHintAfterMisses:2,leniency:1.1,
      strokeAnimationSpeed:0.9,delayBetweenStrokes:300
    },opts));
  }
  function setMode(m){
    mode=m; markModes(); actions.innerHTML='';
    if(m==='watch'){
      make({showCharacter:false,showOutline:true});
      const play=()=>{setStatus(`${NA()}, 잘 봐! 한 획씩 써 볼게`);writer.hideCharacter();
        writer.animateCharacter({onComplete:()=>{setStatus(`${n}획 끝! ${NA()}, 이제 따라 써 볼까?`,'good');S.watch[c]=1;save();markModes();}});};
      actions.innerHTML='<button class="btn alt" id="replay">다시 보기</button><button class="btn" id="gotrace">따라 쓰기 →</button>';
      $('#replay').onclick=play; $('#gotrace').onclick=()=>setMode('trace');
      play();
    }else{
      const solo=m==='solo';
      make({showCharacter:false,showOutline:!solo,showHintAfterMisses:solo?3:2});
      setStatus(solo?`이번엔 ${NI()} 혼자 써 보자! 막히면 힌트가 나올 거야`:`${NA()}, 흐린 글자 위에 1번 획부터 따라 써 봐`);
      actions.innerHTML=`<button class="btn alt" id="again">처음부터</button>`;
      $('#again').onclick=()=>setMode(m);
      // 획 길이 검사: 라이브러리 기본값은 본래 획의 1/4만 그어도 통과라서, 6할 이상 그어야 인정
      const med=STROKES[c].medians.map(m=>m.reduce((s,q,k)=>k?s+Math.hypot(q[0]-m[k-1][0],q[1]-m[k-1][1]):0,0));
      const plen=ps=>ps.reduce((s,q,k)=>k?s+Math.hypot(q.x-ps[k-1].x,q.y-ps[k-1].y):0,0);
      let extra=0, redo=false;
      let mine=[];   // 이번에 맞게 쓴 획들 (글자 좌표)
      const start=from=>{redo=false; mine=mine.slice(0,from); writer.quiz({
        quizStartStrokeNum:from,
        onCorrectStroke:d=>{
          const drawn=plen((d.drawnPath&&d.drawnPath.points)||[]);
          if((drawn+40)/(med[d.strokeNum]+40)<0.6){   // 너무 짧게 그음 → 그 획부터 다시
            redo=true; extra++;
            setStatus(`${d.strokeNum+1}번째 획을 끝까지 쭉 그어 봐!`,'oops');
            setTimeout(()=>start(d.strokeNum),450); return;
          }
          mine[d.strokeNum]=((d.drawnPath&&d.drawnPath.points)||[]).map(q=>[Math.round(q.x),Math.round(q.y)]);
          setStatus(d.strokesRemaining?`${d.strokeNum+1}번째 획 좋아!`:'','good');},
        onMistake:d=>setStatus(`괜찮아, ${d.strokeNum+1}번째 획 다시 해 보자. 시작점을 봐!`,'oops'),
        onComplete:r0=>{
          if(redo) return;
          const r={totalMistakes:r0.totalMistakes+extra};
          keepHW(m,mine.filter(Boolean),r.totalMistakes);
          if(solo){
            const had=S.solo[c]; S.soloDone[c]=1; save();
            const how=r.totalMistakes?`혼자 쓰기 성공! 틀린 획 ${r.totalMistakes}번.`:`${NI()} 완벽해! 한 번도 안 틀렸어.`;
            if(tryStamp(c)) setStatus(`${how} 참 잘했어요 도장!`,'good');
            else{chime(); setStatus(had?how:`${how} 이제 아래 쓰기 노트 7칸을 채우면 도장!`,'good');}
          }else{S[m][c]=1;save(); chime(); setStatus(`역시 ${NI()}! 이제 혼자 써 볼까?`,'good');
            actions.insertAdjacentHTML('beforeend','<button class="btn" id="gosolo">혼자 쓰기 →</button>');$('#gosolo').onclick=()=>setMode('solo');}
          markModes();
        }
      });};
      start(0);
    }
  }
  view.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  setMode(S.watch[c]?(S.trace[c]?'solo':'trace'):'watch');

  /* notebook */
  cleanup=notebook(c);
}

// '참' 도장: 혼자 쓰기와 쓰기 노트를 모두 마친 순간 한 번 찍음
function tryStamp(c){
  if(S.solo[c]||!S.soloDone[c]||!S.note[c]) return false;
  const dd=DAYS.findIndex(D=>D.l&&D.l.some(l=>LESSONS[l].c.includes(c))), was=dd>=0&&dayDone(dd);
  S.solo[c]=1; save(); chime(); stampFx('참 잘했어요',`${c} ${hunum(c)}`); celebrateIfDone(dd,was);
  const t=view.querySelector('.ctab[aria-current="true"]'); if(t&&!t.querySelector('.dot')) t.insertAdjacentHTML('beforeend','<span class="dot">참</span>');
  return true;
}
function notebook(c){
  const box=$('#note'), bg=$('#nbg'), ink=$('#nink'), msg=$('#nbmsg');
  // 칸 0은 본보기. 1~7은 차례대로 쓰되, 이미 쓴 칸으로는 언제든 돌아가서 고쳐 쓸 수 있음
  // 획은 글자마다 따로 저장 (용량이 커져도 도장 기록 저장에 영향 없게)
  const INK_KEY='hanja8-ink-'+c;
  let saved=[]; try{saved=JSON.parse(localStorage.getItem(INK_KEY)||'[]');}catch(e){}
  const strokes=saved.map(s=>({cell:s.c,pts:s.p}));   // 전에 쓴 획 불러오기
  let cur=null, penSeen=false, W=0, cell=0, cols=4, rows=2, active=strokes.length?strokes[strokes.length-1].cell:1;
  const LAST=cols*rows-1;
  const has=i=>strokes.some(s=>s.cell===i);
  const front=()=>strokes.reduce((m,s)=>Math.max(m,s.cell),1);          // 지금까지 쓴 가장 뒤 칸
  const reach=()=>Math.min(LAST,front()+(has(front())?1:0));           // 쓸 수 있는 가장 뒤 칸
  function say(){
    msg.textContent=active===LAST&&has(active)?'마지막 칸이야! 다 쓰면 끝!'
      :active<front()?`${active}번째 칸을 고쳐 쓰는 중이야. 다 고치면 ${reach()}번째 칸으로 가자.`
      :has(active)?`다 썼으면 ${active+1}번째 칸으로 넘어가서 써 봐.`
      :active===1?'파란 칸부터 차례대로 한 칸씩 써 보자.':`${active}번째 칸에 써 봐.`;
    msg.className='nb-msg';
  }
  function layout(){
    // 4칸 × 2줄 = 8칸 (보기 1, 따라 쓰기 2, 혼자 쓰기 5)
    W=box.clientWidth; cell=W/cols; const H=cell*rows;
    box.style.height=H+'px';
    const dpr=window.devicePixelRatio||1;
    [bg,ink].forEach(cv=>{cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);});
    drawBg(); redraw();
  }
  const rect=i=>[(i%cols)*cell,Math.floor(i/cols)*cell];
  function drawBg(){
    const g=bg.getContext('2d'); g.clearRect(0,0,W,cell*rows);
    g.fillStyle='#FFFFFF'; g.fillRect(0,0,W,cell*rows);
    g.font=`700 ${cell*0.74}px "LXGW WenKai TC", "Kaiti TC", serif`; g.textAlign='center'; g.textBaseline='middle';
    for(let idx=0;idx<=LAST;idx++){
      const [x,y]=rect(idx);
      if(idx===active){g.fillStyle='#EAF2FC';g.fillRect(x,y,cell,cell);}
      else if(idx>reach()){g.fillStyle='#F7F9FB';g.fillRect(x,y,cell,cell);}
      if(idx<3){const col=idx===0?'#9FB2C8':'#D6E2F0';g.fillStyle=col;g.strokeStyle=col;g.lineWidth=cell*0.02;g.lineJoin='round';
        g.strokeText(c,x+cell/2,y+cell/2+cell*0.04);g.fillText(c,x+cell/2,y+cell/2+cell*0.04);}
      g.strokeStyle='#8FB3DE'; g.lineWidth=1; g.setLineDash([5,5]);
      g.beginPath();g.moveTo(x+cell/2,y+4);g.lineTo(x+cell/2,y+cell-4);g.moveTo(x+4,y+cell/2);g.lineTo(x+cell-4,y+cell/2);g.stroke();
      g.setLineDash([]); g.lineWidth=2; g.strokeRect(x+1,y+1,cell-2,cell-2);
      g.fillStyle='#9FB2C8'; g.font=`700 ${Math.max(11,cell*0.07)}px sans-serif`; g.textAlign='left'; g.textBaseline='top';
      if(idx>0) g.fillText(String(idx),x+8,y+6);
      g.font=`700 ${cell*0.74}px "LXGW WenKai TC", "Kaiti TC", serif`; g.textAlign='center'; g.textBaseline='middle';
    }
    const [ax,ay]=rect(active);   // 지금 쓸 칸
    g.strokeStyle='#2B6CC4'; g.lineWidth=4; g.strokeRect(ax+2,ay+2,cell-4,cell-4);
  }
  // 획은 자기 칸 밖으로 넘어가지 않게 잘라서 그림
  function seg(g,s,a,b){
    const [x,y]=rect(s.cell);
    g.save(); g.beginPath(); g.rect(x+2,y+2,cell-4,cell-4); g.clip();
    g.lineWidth=b[2]*W; g.beginPath(); g.moveTo(a[0]*W,a[1]*W); g.lineTo(b[0]*W,b[1]*W); g.stroke();
    g.restore();
  }
  function pen(g){g.strokeStyle='#1F5FBF'; g.lineCap='round'; g.lineJoin='round';}
  function redraw(){
    const g=ink.getContext('2d'); g.clearRect(0,0,W,cell*rows); pen(g);
    strokes.forEach(s=>{const p=s.pts; for(let k=1;k<p.length;k++)seg(g,s,p[k-1],p[k]); if(p.length===1)seg(g,s,p[0],p[0]);});
  }
  function pt(e){
    const r=ink.getBoundingClientRect();
    const base=cell*0.055, p=e.pointerType==='pen'?(e.pressure||0.5):0.5;
    return [(e.clientX-r.left)/W,(e.clientY-r.top)/W,(base*(0.45+p*1.1))/W];
  }
  function cellAt(p){return Math.min(rows-1,Math.floor(p[1]*W/cell))*cols+Math.min(cols-1,Math.floor(p[0]*W/cell));}
  function down(e){
    if(e.pointerType==='pen') penSeen=true;
    if(e.pointerType==='touch'&&penSeen) return;
    e.preventDefault();
    const p=pt(e), i=cellAt(p);
    if(i===0||i>reach()){
      msg.textContent=i===0?'첫 칸은 보고 쓰는 본보기야. 파란 칸에 써 봐!':`차례대로! ${reach()}번째 칸까지만 쓸 수 있어.`;
      msg.className='nb-msg warn'; return;
    }
    if(i!==active){active=i;drawBg();}   // 다음 칸으로 넘어가거나, 앞 칸으로 돌아가서 고쳐 쓰기
    ink.setPointerCapture(e.pointerId);
    cur={id:e.pointerId,s:{cell:active,pts:[p]}}; strokes.push(cur.s);
    const g=ink.getContext('2d'); pen(g); seg(g,cur.s,p,p);
  }
  function move(e){
    if(!cur||e.pointerId!==cur.id) return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    const g=ink.getContext('2d'); pen(g); const ps=cur.s.pts;
    for(const ev of (evs.length?evs:[e])){const p=pt(ev);seg(g,cur.s,ps[ps.length-1],p);ps.push(p);}
  }
  const r3=v=>Math.round(v*1000)/1000;
  function thin(ps){   // 너무 촘촘한 점은 덜어내서 저장 용량 줄이기
    const out=[];
    for(const q of ps){const l=out[out.length-1]; if(!l||Math.hypot(q[0]-l[0],q[1]-l[1])>0.002) out.push([r3(q[0]),r3(q[1]),Math.round(q[2]*10000)/10000]);}
    return out;
  }
  function store(){
    try{localStorage.setItem(INK_KEY,JSON.stringify(strokes.map(s=>({c:s.cell,p:thin(s.pts)}))));}catch(e){}
    let first=false;
    if(!S.note[c]&&[1,2,3,4,5,6,7].every(has)){S.note[c]=1;first=true;}
    save();
    if(first){   // 7칸을 처음 다 채운 순간 한 번만 축하
      $('#nbdone').hidden=false;
      const tab=view.querySelector('.ctab[aria-current="true"]'); if(tab&&!tab.querySelector('.ndot')) tab.insertAdjacentHTML('beforeend','<span class="ndot" title="쓰기 노트 완료">✎</span>');
      if(tryStamp(c)){msg.textContent='쓰기 노트까지 완성! 참 잘했어요 도장!';speak(`${NA()}, ${hunum(c)} 도장 받았어! 정말 잘했어!`);}
      else{chime(); stampFx('쓰기 노트 완료',`${c} ${hunum(c)}`); speak(`${NA()}, ${hunum(c)} 쓰기 노트 완성! 잘했어!`);
        if(!S.soloDone[c]) msg.textContent='쓰기 노트 완성! 위에서 혼자 쓰기까지 하면 참 잘했어요 도장!';}
    }
  }
  function up(e){if(cur&&e.pointerId===cur.id){cur=null;say();store();}}
  ink.addEventListener('pointerdown',down); ink.addEventListener('pointermove',move);
  ink.addEventListener('pointerup',up); ink.addEventListener('pointercancel',up);
  $('#undo').onclick=()=>{strokes.pop(); active=strokes.length?strokes[strokes.length-1].cell:1; drawBg(); redraw(); say(); store();};
  $('#clear').onclick=()=>{strokes.length=0; active=1; drawBg(); redraw(); say(); store();};   // 완료 기록은 지워지지 않음
  const ro=new ResizeObserver(()=>{if(box.clientWidth!==W)layout();}); ro.observe(box);
  layout(); say();
  if(document.fonts&&document.fonts.load) document.fonts.load(`700 80px "LXGW WenKai TC"`,c).then(drawBg).catch(()=>{});
  return ()=>ro.disconnect();
}

  '{十年} 뒤에 나는 어른이 돼요.|십년|', '{女軍} 언니가 멋져요.|여군|녀군',

const QTYPES={hun:'훈음 맞히기',char:'한자 찾기',read:'읽기 퀴즈',stroke:'필순 퀴즈'};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
function pick4(ans,extra,pool){
  const out=[ans,...extra.filter(Boolean)];
  for(const x of shuffle(pool)){if(out.length>=4)break;if(!out.includes(x))out.push(x);}
  const choices=shuffle(out); return {choices,a:choices.indexOf(ans)};
}
function qHun(c){
  const [h,e]=INFO[c];
  return {kind:QTYPES.hun,ask:'이 한자의 뜻과 소리는?',say:'이 한자의 뜻과 소리는 무엇일까?',
    body:`<div class="bigq han">${c}</div>`,...pick4(hunum(c),[],POOL.map(hunum)),after:`${h}, ${e}`,
    review:`<span class="han">${c}</span>의 뜻과 소리`};
}
function qChar(c){
  const [h,e]=INFO[c];
  return {kind:QTYPES.char,ask:`‘${hunum(c)}’에 알맞은 한자는?`,say:`${h}, ${e}. 알맞은 한자를 찾아봐.`,
    body:`<div class="hq">${hunum(c)}</div>`,han:true,...pick4(c,[],POOL),after:`${h}, ${e}`,
    review:`‘${hunum(c)}’에 맞는 한자`};
}
function qRead(s){
  const [sent,ans,trap]=s.split('|');
  const others=READS.map(x=>x.split('|')[1]).filter(r=>r!==ans);
  const same=others.filter(r=>r.length===ans.length);
  return {kind:QTYPES.read,ask:'밑줄 친 한자어를 어떻게 읽을까?',say:'밑줄 친 한자어를 어떻게 읽을까?',
    body:`<div class="sent">${sent.replace(/\{(.+?)\}/,'<u>$1</u>')}</div>`,
    ...pick4(ans,[trap],same.length>=3?same:others),after:sent.replace(/\{(.+?)\}/,ans),
    review:sent.replace(/\{(.+?)\}/,'<u>$1</u>')};
}
function qStroke(c){
  const n=STROKES[c].strokes.length, k=Math.floor(Math.random()*n);
  const start=n<=4?0:Math.max(0,Math.min(n-4,k-Math.floor(Math.random()*4)));
  const nums=[];for(let x=start;x<Math.min(n,start+4);x++)nums.push(`${x+1}번째`);
  return {kind:QTYPES.stroke,ask:'빨간 획은 몇 번째로 쓸까?',say:'빨간 획은 몇 번째로 쓸까?',
    body:charSVG(c,{upto:99,hl:k,ghost:false}),choices:nums,a:k-start,after:`${k+1}번째로 써.`,
    review:`<span class="han">${c}</span>의 ${k+1}번째 획`};
}
const QN=5;   // 한 번에 5문제: 초3이 지치지 않는 분량
function makeQuiz(type){
  POOL=quizPool();
  if(POOL.length<4) return [];
  const d=S.day||0, learned=DAYS[d].l?DAYS.slice(0,d+1).flatMap((_,k)=>dayChars(k)):LESSONS.flatMap(x=>x.c.split(''));
  const reads=READS.filter(s=>{const w=[...s.match(/\{(.+?)\}/)[1]];return w.some(c=>POOL.includes(c))&&w.every(c=>learned.includes(c));});
  const strokeChars=POOL.filter(c=>STROKES[c].strokes.length>=3);
  const rand=a=>a[Math.floor(Math.random()*a.length)];
  if(type==='hun') return sample(POOL,QN).map(qHun);
  if(type==='char') return sample(POOL,QN).map(qChar);
  if(type==='read') return sample(reads,QN).map(qRead);
  if(type==='stroke') return Array.from({length:QN},()=>qStroke(rand(strokeChars)));
  return shuffle([...sample(POOL,2).map(qHun),qChar(rand(POOL)),...sample(reads,1).map(qRead),qStroke(rand(strokeChars))]);
}
function renderQuiz(arg){
  const QUIZ=makeQuiz(arg&&arg.type);
  if(!QUIZ.length){toast('문제를 만들 글자가 부족해요');go('home');return;}
  let q=0, res=[], alive=true;
  cleanup=()=>{alive=false;};
  // 돌아가기 버튼: 글자 공부 화면처럼 흰 카드 바깥 왼쪽 위
  const backBtn=()=>`<div class="tabs"><button class="back" id="qback">← ${PREV==='home'?'홈':'학습'}</button></div>`;
  const bindBack=()=>{$('#qback').onclick=()=>go(PREV==='home'?'home':'lessons');};
  const draw=()=>{
    if(!alive) return;
    if(q>=QUIZ.length) return done();
    const Q=QUIZ[q];
    view.innerHTML=`${backBtn()}<section class="sheet quiz">
      <div class="qtop"><span class="kind">${Q.kind}</span><span class="dots">${QUIZ.map((_,k)=>`<i class="${k<q?(res[k]?'o':'x'):(k===q?'c':'')}"></i>`).join('')}</span><span class="count">${q+1} / ${QUIZ.length}</span></div>
      <div class="qask">${Q.ask}<button class="speak" id="qsay">${ICON_SPK} 읽어줘</button></div>
      <div class="qbody">${typeof Q.body==='function'?Q.body():Q.body}</div>
      <div class="choices">${Q.choices.map((t,k)=>`<button class="choice ${Q.han?'han':''}" data-k="${k}"><span class="no">${k+1}</span>${t}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
    </section>`;
    bindBack();
    $('#qsay').onclick=()=>speak(Q.say);
    view.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(view.querySelector('.choice.right')) return;
      const k=+b.dataset.k, ok=k===Q.a;
      view.querySelector(`.choice[data-k="${Q.a}"]`).classList.add('right');
      if(!ok) b.classList.add('wrong');
      res[q]=ok; chime(ok);
      $('#fb').innerHTML=ok?`<b style="color:var(--leaf)">딩동댕! ${NI()} 정답!</b>`:`<b style="color:var(--stamp)">아깝다, 괜찮아!</b> 정답은 ${Q.choices[Q.a]}. 다음엔 맞힐 수 있어.`;
      speak(Q.after);
      setTimeout(()=>{q++;draw();},1800);
    });
  };
  const done=()=>{
    const s=res.filter(Boolean).length, d=S.day||0, t=arg&&arg.type;
    if(QT.includes(t)){const was=dayDone(d), k=qKey(d,t); S.quiz[k]=Math.max(S.quiz[k]??0,s); save(); celebrateIfDone(d,was);}
    if(s===QUIZ.length){chime();stampFx('참 잘했어요','만점!');}
    view.innerHTML=`${backBtn()}<section class="sheet quiz"><div class="result">
      <div class="score">${s} / ${QUIZ.length}</div>
      <p>${s===QUIZ.length?`${NI()} 다 맞혔어! 이 기세로 계속 가 보자.`:`${NA()}, 틀린 글자는 쓰기 노트에서 한 번 더 써 보자.`}</p>
      <p style="color:var(--ink-soft);font-size:15px">다시 풀면 문제가 새로 섞여요.</p>
      <div class="actions"><button class="btn alt" id="re">다시 풀기</button><button class="btn" id="home">${PREV==='home'?'홈으로':'학습으로'}</button></div>
    </div></section>`;
    bindBack();
    $('#re').onclick=()=>renderQuiz(arg); $('#home').onclick=()=>go(PREV==='home'?'home':'lessons');
  };
  draw();
}

/* ---------- 모의시험: 독음 24 · 훈음 24 · 필순 2 = 50문항, 50분, 35개 이상 합격 ---------- */
function makeExam(){
  POOL=LESSONS.flatMap(x=>x.c.split(''));
  const hunChars=shuffle(POOL).slice(0,24);
  const strokeChars=POOL.filter(c=>STROKES[c].strokes.length>=4);
  return [...sample(READS,24).map(qRead),
    ...hunChars.slice(0,14).map(qHun), ...hunChars.slice(14).map(qChar),
    ...sample(strokeChars,2).map(qStroke)];
}
function renderExam(){
  const QS=makeExam(), ans=Array(QS.length).fill(null), LIMIT=50*60;
  let q=0, left=LIMIT, alive=true;
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const part=i=>i<24?'독음':i<48?'훈음':'필순';
  const timer=setInterval(()=>{
    if(!alive) return;
    left--; const el=$('#etime'); if(el) el.textContent=fmt(left);
    if(left<=0) finish();
  },1000);
  cleanup=()=>{alive=false;clearInterval(timer);};
  const askQuit=()=>{
    $('#econfirm').innerHTML=`<div class="sheet confirmbar"><span>시험을 그만둘까? 지금까지 푼 답은 저장되지 않아.</span>
      <button class="btn alt" id="cq">계속 풀기</button><button class="btn red" id="cy">그만두기</button></div>`;
    $('#cq').onclick=()=>{$('#econfirm').innerHTML='';};
    $('#cy').onclick=()=>go('home');
  };
  const draw=()=>{
    if(!alive) return;
    const Q=QS[q], done=ans.filter(a=>a!=null).length, last=q===QS.length-1;
    view.innerHTML=`<div class="tabs"><button class="back" id="eback">← 홈</button><span class="ttl">모의시험</span><span class="etime" id="etime">${fmt(left)}</span></div>
    <div id="econfirm"></div>
    <section class="sheet quiz">
      <div class="qtop"><span class="kind">${part(q)} · ${q+1}번</span><span class="count">푼 문제 ${done} / ${QS.length}</span></div>
      <div class="pbar"><i style="width:${done/QS.length*100}%"></i></div>
      <div class="qask">${Q.ask}<button class="speak" id="qsay">${ICON_SPK} 읽어줘</button></div>
      <div class="qbody">${Q.body}</div>
      <div class="choices">${Q.choices.map((t,k)=>`<button class="choice ${Q.han?'han':''} ${ans[q]===k?'picked':''}" data-k="${k}"><span class="no">${k+1}</span>${t}</button>`).join('')}</div>
      <div class="enav"><button class="btn alt" id="eprev" ${q===0?'disabled':''}>← 이전 문제</button>
        ${last?'<button class="btn red" id="esubmit">답안 내기</button>':'<button class="btn" id="enext">다음 문제 →</button>'}</div>
    </section>`;
    $('#eback').onclick=askQuit;
    $('#qsay').onclick=()=>speak(Q.say);
    view.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ans[q]=+b.dataset.k; if(!last) q++; draw();});
    $('#eprev').onclick=()=>{if(q>0){q--;draw();}};
    const n=$('#enext'); if(n) n.onclick=()=>{q++;draw();};
    const s=$('#esubmit'); if(s) s.onclick=()=>{
      const miss=ans.filter(a=>a==null).length;
      if(miss&&!s.dataset.sure){s.dataset.sure='1';s.textContent=`안 푼 문제 ${miss}개! 그래도 내기`;return;}
      finish();};
  };
  function finish(){
    if(!alive) return;
    alive=false; clearInterval(timer);
    const ok=i=>ans[i]===QS[i].a;
    const score=QS.filter((_,i)=>ok(i)).length, pass=score>=35;
    const partScore=(a,b)=>QS.slice(a,b).filter((_,k)=>ok(a+k)).length;
    S.examDone=true; S.examBest=Math.max(S.examBest||0,score); save();
    chime(pass); if(pass) stampFx('합격!',`${score}점`);
    speak(pass?`합격이야! ${NA()}, 정말 대단해!`:`${NA()}, ${35-score}개만 더 맞히면 합격이야. 틀린 문제를 같이 보자.`);
    const wrong=QS.map((Q,i)=>({Q,i})).filter(({i})=>!ok(i));
    view.innerHTML=`<div class="tabs"><button class="back" id="eback">← 홈</button><span class="ttl">모의시험 결과</span></div>
    <section class="sheet quiz">
      <div class="result">
        <div class="score">${score} / ${QS.length}</div>
        <p class="${pass?'passmsg':'failmsg'}">${pass?`합격이야! ${NA()}, 정말 대단해!`:`${35-score}개만 더 맞히면 합격이야. ${NA()}, 틀린 문제를 같이 보자!`}</p>
        <div class="examinfo"><span>독음 ${partScore(0,24)} / 24</span><span>훈음 ${partScore(24,48)} / 24</span><span>필순 ${partScore(48,50)} / 2</span><span>걸린 시간 ${fmt(LIMIT-left)}</span></div>
      </div>
      ${wrong.length?`<h3 class="wtitle">틀린 문제 ${wrong.length}개</h3><div class="wrongs">${wrong.map(({Q,i})=>`
        <div class="wrong"><span class="wn">${i+1}번</span><span class="wq">${Q.review}</span>
        <span class="wa">정답 <b>${Q.choices[Q.a]}</b> · ${ans[i]!=null?`고른 답 ${Q.choices[ans[i]]}`:'안 풀었음'}</span></div>`).join('')}</div>`:''}
      <div class="actions"><button class="btn alt" id="again">새 시험 보기</button><button class="btn" id="tohome">홈으로</button></div>
    </section>`;
    $('#eback').onclick=()=>go('home'); $('#tohome').onclick=()=>go('home'); $('#again').onclick=()=>go('exam');
  }
  draw();
}

/* ---------- 아빠 전용: 비밀번호(숫자 키패드) → 기록 초기화 ---------- */
const DAD_PIN='4488';   // 아이가 실수로 지우지 않게 막는 용도 (보안용 비밀번호 아님)
function resetDay(d){

function openDad(){

    if(e.key==='Escape') close();

    </div>`;

        <p>도장, 퀴즈, 모의시험, 쓰기 노트, 글씨 기록을 모두 지우고 1회차부터 다시 시작해요.</p>
        <button class="btn warnbtn" data-reset="all">전체 기록 지우기</button></div>
      <div id="dadconfirm"></div>
    </div>`;
    m.querySelector('.mclose').onclick=close;
    m.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>ask(b.dataset.reset));
  }
  function ask(target){
    const label=target==='all'?'전체':`${+target+1}회차`;
    const box=m.querySelector('#dadconfirm');
    box.innerHTML=`<div class="sheet confirmbar"><span><b>${label}</b> 기록을 지울까요? 지우면 되돌릴 수 없어요.</span>
      <button class="btn alt" id="dn">취소</button><button class="btn warnbtn" id="dy">지우기</button></div>`;
    box.scrollIntoView({block:'nearest'});
    m.querySelector('#dn').onclick=()=>{box.innerHTML='';};
    m.querySelector('#dy').onclick=()=>{
      if(target==='all') resetAll(); else resetDay(+target);
      changed=true; panel(`${label} 기록을 지웠어요.`);
    };
  }
  m.onclick=e=>{if(e.target===m)close();};
  document.addEventListener('keydown',onKey);
  lock(); document.body.appendChild(m);
}

go('home');
</script>

</body>
</html>
